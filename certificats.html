<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#050816">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/pages.css"><link rel="stylesheet" href="assets/css/responsive.css"><title>Mes NovaCertificates | CodeNova"></head>
<body><header class="site-header"><div class="header-container"><a href="index.html" class="brand brand-home"><img src="assets/images/logo.png" alt="Logo CodeNova" class="brand-logo"></a><nav class="main-nav"><a href="index.html" class="nav-link">Accueil</a><a href="cours.html" class="nav-link">Cours</a><a href="dashboard.html" class="nav-link">Dashboard</a><a href="profil.html" class="nav-link">Profil</a><a href="certificats.html" class="nav-link" data-auth-only>NovaCertificates</a></nav><div class="header-actions"><button class="theme-toggle" id="themeToggle" type="button">☾</button><a href="index.html" class="btn-secondary">Accueil</a></div></div></header>
<main><section class="page-hero"><div class="section-container"><span class="hero-badge">NOVA CERTIFICATE</span><h1>Mes <span class="gradient-text">attestations.</span></h1><p>Retrouve les parcours que tu as terminés et ouvre tes attestations.</p></div></section>
<section class="internal-content section-container"><div id="certList" class="dashboard-grid"></div></section></main>
<script src="assets/js/courses-data.js"></script><script src="assets/js/auth.js"></script>
<script>
const list=document.getElementById('certList');const user=CodeNovaAuth.currentUser();if(!user) location.href='connexion.html?redirect=certificats.html';
const done=CodeNovaCourses.filter(c=>JSON.parse(localStorage.getItem('codenova-progress-'+c.id)||'{"completed":false}').completed);
if(!done.length) list.innerHTML='<div class="dash-card"><h2>Aucune attestation pour le moment</h2><p>Termine un parcours à 100 % pour obtenir ton NovaCertificate.</p><a href="cours.html" class="btn-primary" style="margin-top:18px">Découvrir les cours →</a></div>';
else list.innerHTML=done.map(c=>{const certId=localStorage.getItem('codenova-certificate-'+c.id)||'à générer';return `<div class="dash-card"><span class="section-label">NOVA CERTIFICATE</span><h3 style="margin-top:8px">${c.title}</h3><p>Identifiant : <strong>${certId}</strong></p><a class="btn-primary" style="margin-top:16px" href="certificat.html?course=${encodeURIComponent(c.id)}">Ouvrir l’attestation →</a></div>`}).join('');
</script></body></html>
