<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#050816">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/pages.css"><link rel="stylesheet" href="assets/css/responsive.css"><title>NovaCertificate | CodeNova">
<style>
.certificate-wrap{padding:40px 0 90px}.certificate{max-width:900px;margin:0 auto;padding:65px;border:2px solid rgba(54,124,255,.35);border-radius:28px;background:linear-gradient(145deg,#08112a,#030713);text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.3)}.certificate .seal{font-size:3.2rem;margin-bottom:8px}.certificate h2{font-size:3rem;margin:8px 0}.certificate .recipient{font-size:2rem;font-weight:800;margin:18px 0}.certificate .course-name{font-size:1.6rem;font-weight:700}.certificate-meta{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:28px 0;color:#9da8bf}.certificate-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}@media print{.site-header,.certificate-actions,.no-print{display:none!important}body{background:#fff;color:#111}.certificate{box-shadow:none;border:2px solid #222;background:#fff;color:#111;max-width:none}.certificate .gradient-text{color:#111}.certificate-meta{color:#222}}
</style></head>
<body><header class="site-header no-print"><div class="header-container"><a href="index.html" class="brand brand-home"><img src="assets/images/logo.png" alt="Logo CodeNova" class="brand-logo"></a><nav class="main-nav"><a href="index.html" class="nav-link">Accueil</a><a href="cours.html" class="nav-link">Cours</a><a href="dashboard.html" class="nav-link">Dashboard</a><a href="profil.html" class="nav-link">Profil</a><a href="certificats.html" class="nav-link" data-auth-only>NovaCertificates</a></nav><div class="header-actions"><a href="certificats.html" class="btn-secondary">Mes certificats</a></div></div></header>
<main class="certificate-wrap"><div class="certificate" id="certificate"><div class="seal">🏆</div><span class="section-label">CODE NOVA</span><h2>NovaCertificate</h2><p>ATTESTATION D’APPRENTISSAGE</p><p style="margin-top:24px">Cette attestation est délivrée à</p><div class="recipient" id="recipient">Apprenant</div><p>pour avoir terminé avec succès le parcours</p><div class="course-name" id="courseName">Cours</div><div class="certificate-meta"><span>Score final : <strong>100 %</strong></span><span>Date : <strong id="date"></strong></span><span>ID : <strong id="certId"></strong></span></div><p style="color:#8d99b2">CodeNova • Apprends. Code. Réussis.</p></div>
<div class="certificate-actions no-print"><button class="btn-primary" onclick="window.print()">🖨️ Imprimer / enregistrer en PDF</button><a href="certificats.html" class="btn-secondary">Mes attestations</a></div></main>
<script src="assets/js/courses-data.js"></script><script src="assets/js/auth.js"></script>
<script>
const courseId=new URLSearchParams(location.search).get('course')||localStorage.getItem('codenova-last-certificate');const course=CodeNovaCourses.find(c=>c.id===courseId);
const user=CodeNovaAuth.currentUser();if(!user){location.href='connexion.html?redirect=certificat.html'+(courseId?'%3Fcourse%3D'+encodeURIComponent(courseId):'');}
if(!course) document.getElementById('courseName').textContent='Parcours CodeNova';
document.getElementById('recipient').textContent=user?.name||'Apprenant';document.getElementById('courseName').textContent=course?.title||'Parcours CodeNova';document.getElementById('date').textContent=new Date().toLocaleDateString('fr-FR');
const certKey='codenova-certificate-'+course?.id;let certId=localStorage.getItem(certKey);if(!certId){certId='CN-'+Math.random().toString(36).slice(2,8).toUpperCase()+'-'+Date.now().toString().slice(-4);localStorage.setItem(certKey,certId);}
document.getElementById('certId').textContent=certId;localStorage.setItem('codenova-last-certificate',course?.id||'');
</script></body></html>
