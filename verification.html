<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vérifier un NovaCertificate | CodeNova"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/pages.css"><link rel="stylesheet" href="assets/css/responsive.css"></head>
<body><header class="site-header"><div class="header-container"><a href="index.html" class="brand brand-home"><img src="assets/images/logo.png" alt="Logo CodeNova" class="brand-logo"></a><nav class="main-nav"><a href="index.html" class="nav-link">Accueil</a><a href="cours.html" class="nav-link">Cours</a><a href="dashboard.html" class="nav-link">Dashboard</a></nav></div></header>
<main><section class="page-hero"><div class="section-container"><span class="hero-badge">VÉRIFICATION</span><h1>Vérifier un <span class="gradient-text">NovaCertificate.</span></h1><p>Saisis l’identifiant affiché sur l’attestation.</p><form id="verifyForm" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px"><input id="verifyInput" required placeholder="Ex. CN-AB12CD-1234" style="padding:13px 16px;border-radius:999px;border:1px solid rgba(100,130,255,.25);background:#081126;color:#fff;min-width:280px"><button class="btn-primary" type="submit">Vérifier</button></form></div></section>
<section class="internal-content section-container"><div id="result"></div></section></main>
<script src="assets/js/courses-data.js"></script><script>
const result=document.getElementById('result'), form=document.getElementById('verifyForm');
form.addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('verifyInput').value.trim().toUpperCase();let found=null;for(const c of CodeNovaCourses){const cert=localStorage.getItem('codenova-certificate-'+c.id);if(cert===id){found=c;break;}}result.innerHTML=found?`<div class="dash-card"><span class="section-label">✅ ATTESTATION VALIDE</span><h2 style="margin-top:8px">${found.title}</h2><p>Cette attestation correspond à un parcours terminé sur CodeNova.</p><p style="margin-top:8px">Identifiant : <strong>${id}</strong></p></div>`:`<div class="dash-card"><span class="section-label">❌ NON TROUVÉ</span><h2 style="margin-top:8px">Attestation introuvable</h2><p>Vérifie l’identifiant saisi.</p></div>`});
</script></body></html>
